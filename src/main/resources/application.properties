# ─── Application ───────────────────────────────────────────
spring.application.name=intelliguard
server.port=8080
spring.profiles.active=${SPRING_PROFILES_ACTIVE:local}

# ─── PostgreSQL Database ────────────────────────────────────
spring.datasource.url=jdbc:postgresql://localhost:5432/IntelliGuard
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ─── JPA / Hibernate ────────────────────────────────────────
# create-drop: creates tables on startup, drops on shutdown (good for dev)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# ─── Actuator (health checks) ───────────────────────────────
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=${HEALTH_SHOW_DETAILS:when_authorized}

#─── Logging ────────────────────────────────────────────────
logging.level.com.intelliguard=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ─── Redis ──────────────────────────────────────────────────
spring.data.redis.host=localhost
spring.data.redis.port=6379

# ─── Kafka ──────────────────────────────────────────────────
spring.kafka.bootstrap-servers=localhost:9092

# Producer config
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

# Consumer config
spring.kafka.consumer.group-id=intelliguard-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.intelliguard.dto

# ─── JWT ────────────────────────────────────────────────────
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
app.auth.allow-public-registration=${ALLOW_PUBLIC_REGISTRATION:false}
app.demo.seed-data=${DEMO_SEED_DATA:false}
app.security.trusted-proxies=${TRUSTED_PROXIES:}
app.rate-limit.login-per-minute=${LOGIN_RATE_LIMIT_PER_MINUTE:5}
app.rate-limit.api-per-minute=${API_RATE_LIMIT_PER_MINUTE:120}

# ─── Swagger ────────────────────────────────────────────────
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# ─── Performance tuning ─────────────────────────────────────
# Database connection pool
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# JPA batch operations
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Redis timeout
spring.data.redis.timeout=2000ms
spring.data.redis.lettuce.pool.max-active=10
spring.data.redis.lettuce.pool.min-idle=2

# Kafka producer performance
spring.kafka.producer.batch-size=16384
spring.kafka.producer.linger-ms=5
spring.kafka.producer.compression-type=snappy
